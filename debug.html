<!doctype html><html><body style="margin:0;background:#444;color:#fff;font:14px sans-serif">
<canvas id="c" style="width:540px;height:960px"></canvas><canvas id="d" style="width:540px;height:960px"></canvas><pre id="o"></pre>
<script type="module">
import { drawFit, detectPerson, upscaleMask, buildLines } from '/src/sketch.js';
const img = new Image(); img.src = '/test2.png'; await img.decode();
const W=1080,H=1920;
const fit=document.createElement('canvas'); fit.width=W; fit.height=H;
const fx=fit.getContext('2d',{willReadFrequently:true}); fx.fillStyle='#fff'; fx.fillRect(0,0,W,H);
const rect=drawFit(fx,img,W,H);
const t0=performance.now();
const det=detectPerson(fit,rect,W,H);
const t1=performance.now();
const {pm}=upscaleMask(det,W,H);
const A=buildLines(fit,pm,W,H,rect);
const t2=performance.now();
const c=document.getElementById('c'); c.width=W; c.height=H; const cx=c.getContext('2d');
cx.drawImage(fit,0,0);
const id=cx.getImageData(0,0,W,H);
for(let i=0;i<pm.length;i++) if(pm[i]){ id.data[i*4]=id.data[i*4]*0.5+127; id.data[i*4+1]*=0.5; id.data[i*4+2]*=0.5; }
cx.putImageData(id,0,0);
const d=document.getElementById('d'); d.width=W; d.height=H; const dx=d.getContext('2d');
dx.fillStyle='#fff'; dx.fillRect(0,0,W,H);
const lid=dx.getImageData(0,0,W,H); let n=0;
for(let i=0;i<A.length;i++) if(A[i]>8){ n++; const v=255-A[i]; lid.data[i*4]=v; lid.data[i*4+1]=v; lid.data[i*4+2]=v; }
dx.putImageData(lid,0,0);
document.getElementById('o').textContent=`rect ${JSON.stringify(rect)} detect ${(t1-t0)|0}ms total ${(t2-t0)|0}ms linepx ${n} personpx ${pm.reduce((a,b)=>a+b,0)}`;
</script></body></html>
